<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Warn-Sys - Admin Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f3f4f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        
        /* Card Design */
        .card-container { background: white; padding: 40px; width: 350px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border-top: 6px solid #3b82f6; }
        
        .header { text-align: center; margin-bottom: 30px; }
        .header h2 { margin: 0; color: #1f2937; font-size: 24px; font-weight: 700; }
        .header p { margin: 5px 0 0 0; color: #6b7280; font-size: 14px; }
        
        label { font-size: 14px; color: #4b5563; font-weight: 600; margin-bottom: 8px; display: block; }
        select, input { width: 100%; padding: 14px; margin-bottom: 25px; border: 1px solid #d1d5db; border-radius: 8px; box-sizing: border-box; font-family: 'Plus Jakarta Sans'; outline: none; transition: 0.3s; background: #f9fafb; }
        select:focus, input:focus { border-color: #3b82f6; background: white; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        
        button { width: 100%; background: #3b82f6; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 10px; }
        button:hover { background: #2563eb; transform: translateY(-2px); }
        
        #message, #loginError { text-align: center; font-size: 14px; font-weight: 600; margin-bottom: 15px; padding: 10px; border-radius: 6px; display: none; }
        #loginError { background: #fee2e2; color: #ef4444; }
        
        .back-link { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 25px; color: #6b7280; text-decoration: none; font-size: 14px; font-weight: 600; transition: 0.3s; }
        .back-link:hover { color: #3b82f6; }

        /* Hide Admin Panel Initially */
        #adminPanel { display: none; }
    </style>
</head>
<body>

    <!-- 1. Login Screen -->
    <div class="card-container" id="loginScreen">
        <div class="header">
            <h2><i class="fas fa-lock"></i> Admin Access</h2>
            <p>Authentication Required</p>
        </div>
        
        <div id="loginError"><i class="fas fa-times-circle"></i> Incorrect Password!</div>
        
        <label>Enter Admin Password</label>
        <input type="password" id="adminPass" placeholder="Enter password..." required>
        
        <button onclick="checkPassword()"><i class="fas fa-sign-in-alt"></i> Login to Control Panel</button>
        
        <a href="/dashboard.html" class="back-link"><i class="fas fa-arrow-left"></i> Return to Live Dashboard</a>
    </div>

    <!-- 2. Main Admin Panel (Hidden by default) -->
    <div class="card-container" id="adminPanel">
        <div class="header">
            <h2>Control Panel</h2>
            <p>Update Inventory & Resources</p>
        </div>
        
        <div id="message"></div>
        
        <form id="updateForm">
            <label><i class="fas fa-boxes"></i> Select Resource Module</label>
            <select id="resource_id" required><option value="">Loading resources...</option></select>
            
            <label><i class="fas fa-layer-group"></i> Enter New Stock Quantity</label>
            <input type="number" id="new_stock" required placeholder="E.g. 50">
            
            <button type="submit"><i class="fas fa-sync-alt"></i> Update Database</button>
        </form>
        
        <button onclick="logout()" style="background: #ef4444; margin-top: 15px;"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>

    <script>
        // --- Login Logic ---
        function checkPassword() {
            const pass = document.getElementById('adminPass').value;
            if (pass === "1234") {
                // Hide Login, Show Admin Panel
                document.getElementById('loginScreen').style.display = "none";
                document.getElementById('adminPanel').style.display = "block";
                document.getElementById('adminPass').value = ""; // Clear password field
                loadAdminData(); // Load data from DB after login
            } else {
                // Show Error
                document.getElementById('loginError').style.display = "block";
                setTimeout(() => { document.getElementById('loginError').style.display = "none"; }, 2000);
            }
        }

        // --- Logout Logic ---
        function logout() {
            document.getElementById('adminPanel').style.display = "none";
            document.getElementById('loginScreen').style.display = "block";
        }

        // --- Fetch Database Logic ---
        function loadAdminData() {
            fetch('/api/resources').then(res => res.json()).then(data => {
                const select = document.getElementById('resource_id');
                select.innerHTML = '';
                data.forEach(item => {
                    let opt = document.createElement('option');
                    opt.value = item.id;
                    opt.text = `${item.resource_name} (Current: ${item.current_stock})`;
                    select.appendChild(opt);
                });
            });
        }

        // --- Database Update Logic ---
        document.getElementById('updateForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            const id = document.getElementById('resource_id').value;
            const new_stock = document.getElementById('new_stock').value;
            const msgDiv = document.getElementById('message');

            fetch('/api/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, new_stock })
            }).then(res => res.json()).then(data => {
                msgDiv.style.display = "block"; msgDiv.style.background = "#d1fae5"; msgDiv.style.color = "#10b981";
                msgDiv.innerHTML = '<i class="fas fa-check-circle"></i> ' + data.message;
                document.getElementById('new_stock').value = ''; 
                
                // Refresh dropdown values in background
                loadAdminData();
                setTimeout(() => { msgDiv.style.display = "none"; }, 2000);
            }).catch(err => {
                msgDiv.style.display = "block"; msgDiv.style.background = "#fee2e2"; msgDiv.style.color = "#ef4444";
                msgDiv.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Database Error!';
            });
        });
    </script>
</body>
</html>
